apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-fleet-health
  namespace: monitoring
data:
  fleet-health.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "One row per machine reporting node_exporter metrics -- color-coded cells give an at-a-glance read on fleet health without opening Fleet Overview",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "CPU %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 70
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Memory %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 75
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Disk %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp °C"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 60
                        },
                        {
                          "color": "red",
                          "value": 75
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Network RX (bps)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bps"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Network TX (bps)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bps"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime (s)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Host",
                "desc": false
              }
            ]
          },
          "pluginVersion": "11.6.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) or 100 * ((node_memory_active_bytes + node_memory_wired_bytes + node_memory_compressed_bytes) / node_memory_total_bytes)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",os!=\"steamos\",job!=\"macos-node-exporter\"} or node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",os=\"steamos\",mountpoint=\"/home\"} or node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",job=\"macos-node-exporter\",mountpoint=\"/\"}) / (node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",os!=\"steamos\",job!=\"macos-node-exporter\"} or node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",os=\"steamos\",mountpoint=\"/home\"} or node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|efivarfs|devtmpfs|autofs\",job=\"macos-node-exporter\",mountpoint=\"/\"})))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max by (instance) (node_thermal_zone_temp) or max by (instance) (node_hwmon_temp_celsius > 0)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{device!=\"lo\"}[5m])) * 8",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m])) * 8",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "time() - node_boot_time_seconds",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "G"
            }
          ],
          "title": "Fleet Health",
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(instance|Value.*)$"
                }
              }
            },
            {
              "id": "joinByField",
              "options": {
                "byField": "instance",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {},
                "renameByName": {
                  "instance": "Host",
                  "Value 1": "CPU %",
                  "Value 2": "Memory %",
                  "Value 3": "Disk %",
                  "Value 4": "Temp °C",
                  "Value 5": "Network RX (bps)",
                  "Value 6": "Network TX (bps)",
                  "Value 7": "Uptime (s)",
                  "Value #A": "CPU %",
                  "Value #B": "Memory %",
                  "Value #C": "Disk %",
                  "Value #D": "Temp °C",
                  "Value #E": "Network RX (bps)",
                  "Value #F": "Network TX (bps)",
                  "Value #G": "Uptime (s)"
                }
              }
            }
          ],
          "type": "table"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 16,
      "tags": [
        "fleet",
        "node-exporter"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "time_options": [
          "5m",
          "15m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d",
          "30d"
        ]
      },
      "timezone": "",
      "title": "Fleet Health",
      "uid": "fleet-health",
      "version": 1,
      "description": "At-a-glance color-coded health table, one row per node_exporter instance (cluster nodes, standalone Pis, SteamOS boxes, macOS boxes, anything else added later). CPU/Memory/Disk/Temp cells turn orange/red past warning/critical thresholds; Network and Uptime columns are informational."
    }
